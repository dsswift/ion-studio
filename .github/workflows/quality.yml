name: Quality

# The test lane. It runs beside the release build on every push to main and
# never in front of the push: the push lands, versions, and builds without
# waiting. Its verdict gates publishing instead: a built release stays a draft
# until the jobs that gate its component pass for that commit (GATES in
# .github/scripts/publish-tested-releases.mjs, run by publish.yml when this
# workflow completes). A failure is filed as an issue by the `report` job at
# the bottom. Every product job is scoped to the paths the push touched, on
# pull requests and on main alike, so an iOS-only push runs no Windows job;
# a job a push skips takes its verdict from the nearest earlier run of it.
# Scheduled and manual runs validate every scope.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Full simulator suite: catches broad behavioral regressions without making
    # every push wait for a cold macOS simulator.
    - cron: '17 4 * * *'
  workflow_dispatch:

# A newer push to a pull request supersedes its unfinished run. A push to main
# is never cancelled: each one cuts releases that wait for this run's verdict
# on that exact commit, and the next push's run only tests what it touched.
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  # dorny/paths-filter reads the pull request's file list through the API and,
  # on a push, diffs against the push's `before` commit. A scheduled or manual
  # run has no diff and validates every scope.
  changes:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.filter.outputs.sdk == 'true' || steps.all.outputs.all == 'true' }}
      relay: ${{ steps.filter.outputs.relay == 'true' || steps.all.outputs.all == 'true' }}
      desktop: ${{ steps.filter.outputs.desktop == 'true' || steps.all.outputs.all == 'true' }}
      shared: ${{ steps.filter.outputs.shared == 'true' || steps.all.outputs.all == 'true' }}
      server: ${{ steps.filter.outputs.server == 'true' || steps.all.outputs.all == 'true' }}
      ios: ${{ steps.filter.outputs.ios == 'true' || steps.all.outputs.all == 'true' }}
      logging: ${{ steps.filter.outputs.logging == 'true' || steps.all.outputs.all == 'true' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' || steps.all.outputs.all == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: all
        run: echo "all=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - id: filter
        if: steps.all.outputs.all != 'true'
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: .github/quality-paths.yml

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
      - name: Test release summary context
        run: bash .github/scripts/build-release-summary-context.test.sh
      - name: Test the pipeline's issue and release scripts
        run: |
          bash .github/scripts/open-ci-issue.test.sh
          bash .github/scripts/report-run-failures.test.sh
          bash .github/scripts/hold-built-releases.test.sh
          bash .github/scripts/run-ion-prompt.test.sh
          bash .github/scripts/download-release-assets.test.sh
          node --test .github/scripts/publish-tested-releases.test.mjs
          node --test .github/scripts/write-whats-new.test.mjs

  go-toolchains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Go toolchain alignment
        run: bash scripts/check-go-toolchains.sh
      - name: Test Go toolchain alignment check
        run: bash scripts/check-go-toolchains.test.sh
      - name: Test Linux parity gate receipt semantics
        run: bash scripts/gate-cache.test.sh
      - name: Test Linux parity gate node_modules isolation
        run: bash scripts/test-linux-gate-mounts.test.sh
      - name: Test the root prepare script without husky
        run: bash scripts/husky-install.test.sh
      - name: Test the main-moved check
        run: bash scripts/check-main-current.test.sh
      - name: Studio server installer test
        run: bash scripts/install-studio-server.test.sh

  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file-size caps
        run: bash scripts/check-file-sizes.sh
      # A committed build artifact renders in review as "Bin 0 -> 33644032
      # bytes" and scrolls past. Catch it here rather than in a later cleanup.
      - name: Check no tracked binaries
        run: bash scripts/check-no-binaries.sh

  issue-closure:
    # PR-only: no PR exists on a plain push/schedule/dispatch run to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify referenced issues actually close on merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-issue-closure.sh "${{ github.event.pull_request.number }}"

  # Windows Group Policy template drift. Always runs: the template's registry
  # contract is asserted against docs/enterprise/mdm.md, so a docs-only edit
  # that drops a documented value name is exactly the change this catches.
  admx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ADMX/ADML and registry-contract drift
        run: make check-admx

  # The Windows entry points a Windows contributor runs first. Always runs: a
  # PowerShell syntax error is otherwise only found when the script executes, on
  # a machine nobody here is watching. The ubuntu runner ships pwsh.
  windows-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell entry points parse and behave
        run: make check-windows-scripts

  # The same helper tests under Windows PowerShell 5.1, which is what an SSH
  # session and a plain Start-Menu PowerShell give you on Windows 11. Its
  # error semantics differ from pwsh 7 in ways that have already broken a
  # build: 5.1 turns a native command's stderr into a terminating error, so a
  # `go: downloading ...` progress line failed the whole run. Only this leg
  # tells the two apart.
  windows-scripts-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: IonBuild helpers under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows\IonBuild.test.ps1
      - name: IonBuild helpers under PowerShell 7
        shell: pwsh
        run: .\scripts\windows\IonBuild.test.ps1

  vocabulary:
    # Always runs: registry references can point at source in any product scope.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        # The vocabulary validator uses only Node built-ins, so no npm install is needed.
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Vocabulary registry and generated index
        run: make check-vocabulary

  status-writers:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check status-writer chokepoints
        # Phase 4 of the state-management overhaul. Prohibits new direct
        # writes to tab.status / inst.statusFields outside the
        # dispatcher chokepoints whitelisted in the script. A failure
        # here is intentional — add your call site to the whitelist
        # only if you have reviewed and approved the engine-vs-client
        # state-ownership rule documented in AGENTS.md.
        run: bash scripts/check-status-writers.sh

  server-parity:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Server parity (spec 17)
        # Server owns the store, Studio renders: a direct webContents.send
        # from Electron main is suspect unless the sending file is on the
        # main-process-only allowlist in the script, each entry with a
        # reason. Also gates the executeJavaScript elimination, the deleted
        # single-UI exclusivity keys, and imports of deleted paths.
        run: bash scripts/check-server-parity.sh

  studio-wire:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.server == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The script diffs against the PR base branch to detect a changed
          # fixture; the default shallow (fetch-depth 1) checkout has no
          # history to diff against.
          fetch-depth: 0
      - name: Studio wire protocol version gate
        # A changed or newly-added golden fixture under
        # packages/shared/src/studio-wire/__fixtures__ must ship with a
        # matching '## v<N>' note in docs/protocol/studio-wire.md in the
        # same PR -- the wire shape moved, and that is either a new
        # protocol version or a documented note under the current one.
        run: bash scripts/check-studio-wire.sh
        env:
          STUDIO_WIRE_BASE_REF: origin/${{ github.base_ref || 'main' }}

  check-logging:
    needs: changes
    if: needs.changes.outputs.logging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ADR-019 logging standards
        # Enforces the logging standards from ADR-019: no interpolated msg
        # arguments, no console.* calls in the renderer process, no relay
        # slog package-level calls that bypass relayHandler, and no
        # non-canonical field keys. A failure here means a new call site
        # violates the standard — fix the call site, not the script.
        run: bash scripts/check-logging.sh
      - name: RESERVED-KEY scanner test
        run: bash scripts/check-logging-reserved-keys.test.sh

  check-swiftlint:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: iOS silent-failure lint (SwiftLint)
        # Silent-failure gate for the iOS app, mirroring the "no silent
        # failures" goal of the observability pass and the desktop's
        # check-logging gate. Custom rules in ios/.swiftlint.yml flag empty
        # `catch {}` blocks (error — swallows the error) and silent `try?`
        # statements (warning). Only the empty-catch error fails the build;
        # the try? warnings are advisory, so we do NOT pass --strict (which
        # would escalate every warning to an error and fail on the 100+
        # legitimate try? sites this gate intentionally tolerates). Plain
        # `swiftlint lint` exits non-zero only on error-severity violations.
        #
        # Pinned to the same SwiftLint version used locally (0.65.0) via the
        # official GHCR image so the gate is deterministic and Linux-native
        # (no macos runner needed). The image's entrypoint is swiftlint; we
        # mount the checked-out workspace and lint the app source.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:0.65.0 \
            lint --config ios/.swiftlint.yml ios/IonRemote

  go-lint:
    needs: changes
    if: needs.changes.outputs.relay == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod

      # Full lint on every event: differential mode analyses the whole module
      # anyway and lets lint debt pile up unseen.
      - name: golangci-lint relay
        if: needs.changes.outputs.relay == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: relay
      # The Studio SDK's Go flavor builds against the engine's Go SDK from the
      # pinned engine checkout beside this one.
      - name: Check out the pinned engine
        if: needs.changes.outputs.sdk == 'true'
        run: git clone --quiet --depth 1 --branch "engine-v$(tr -d '[:space:]' < engine/VERSION)" https://github.com/dsswift/ion ../ion
      - name: golangci-lint studio sdk
        if: needs.changes.outputs.sdk == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: packages/studio-sdk/go

  sdk-test:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    # The Studio SDK's Go flavor is its own module (Studio vocabulary stays out
    # of the engine SDK). It builds against the engine's Go SDK from the pinned
    # engine checkout beside this one, and its contract test reads
    # packages/studio-sdk/contract.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the pinned engine
        run: git clone --quiet --depth 1 --branch "engine-v$(tr -d '[:space:]' < engine/VERSION)" https://github.com/dsswift/ion ../ion
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/studio-sdk/go/go.mod
      - name: Studio SDK (Go) tests with race detector
        working-directory: packages/studio-sdk/go
        run: go test -race ./...

  relay-test:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod
      - name: Unit tests with race detector
        working-directory: relay
        run: go test -race ./...

  desktop-test:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Type-check
        working-directory: desktop
        run: npm run typecheck
      - name: Run tests
        working-directory: desktop
        run: npm test

  # Desktop unit tests on a native Windows host. The suite carries win32-pinned
  # arms (path delimiter, modifier keys, engine address, scheduled-task
  # supervisor, machine identity, install dispatch) whose production behaviour
  # only exists on Windows; running them on Linux alone proves the mock, not
  # the platform. windows-latest bills at 2x a Linux minute, and this job is
  # gated on desktop changes so it does not run on every PR.
  desktop-test-windows:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.server == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # This suite's git/worktree/bench fixtures spawn thousands of short-lived
      # git.exe/node.exe/powershell.exe subprocesses. Windows Defender's
      # real-time protection intercepts and scans every new process launch by
      # default, and that per-launch scan cost is what dominates wall-clock on
      # a subprocess-spawn-heavy suite -- npm test alone is ~95% of this job's
      # 14+ minutes. Disabling it is a pure CI-environment tweak (the runner is
      # ephemeral and destroyed after the job) with no effect on what the
      # tests verify.
      - name: Disable Windows Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Type-check
        working-directory: desktop
        run: npm run typecheck
      - name: Run tests
        working-directory: desktop
        run: npm test

  desktop-lint:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: ESLint
        # Enforces react-hooks/rules-of-hooks and react-hooks/exhaustive-deps
        # as errors in renderer/ — the primary structural gate against React
        # error #185 (infinite re-render loops). Also enforces no-console and
        # no-unstable-nested-components in renderer/. See desktop/eslint.config.mjs.
        working-directory: desktop
        run: npm run lint

  # Bundle the Studio renderer for Electron and for the browser. Both bundle
  # the server's session store and packages/shared, and a Node-only import
  # that reaches them fails only at bundle time: typecheck, lint, and every
  # unit test pass. So a server or shared change runs this too, not only a
  # desktop one.
  desktop-build:
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Build (Electron)
        working-directory: desktop
        run: npm run build
      - name: Build (browser)
        working-directory: desktop
        run: npm run build:web

  # @ion/shared's only consumers are desktop and server, all three workspace
  # members, so its gate installs once at the workspace root and runs its
  # typecheck and test scripts by workspace name.
  shared-test:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm -w @ion/shared run typecheck
      - name: Run tests
        run: npm -w @ion/shared test -- --run

  server-typecheck:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm -w server run typecheck

  server-lint:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: ESLint
        run: npm -w server run lint

  server-test:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm -w server test -- --run

  doc-links:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative markdown links resolve
        run: bash scripts/check-doc-links.sh

  # Real compose stack: the pinned engine image and the server sharing one
  # /data volume, proven against an actual `docker compose up` and a /readyz
  # poll, not a mock.
  server-compose-smoke:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (smoke.mjs needs jose + ws)
        run: npm ci --ignore-scripts
      - name: Pin the engine image
        run: echo "ION_ENGINE_VERSION=$(tr -d '[:space:]' < engine/VERSION)" >> "$GITHUB_ENV"
      - name: docker compose up
        working-directory: server
        run: docker compose up -d --build
      - name: Wait for /readyz (up to 60s)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:7331/readyz || true)
            if [ "$code" = "200" ]; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::server never reached /readyz 200 within 60s"
          docker compose -f server/docker-compose.yml logs
          exit 1
      # Nonfunctional requirement: image size logged, gate fails above 400MB.
      # The server image (not the engine's, which is a separate FROM-scratch
      # binary an order of magnitude smaller) is the one this child's
      # multi-stage build + `npm prune --omit=dev` step controls.
      - name: Check server image size (<400MB)
        run: |
          SIZE_BYTES=$(docker image inspect server-server:latest --format '{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "server image size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 400 ]; then
            echo "::error::server image is ${SIZE_MB}MB, over the 400MB gate"
            exit 1
          fi
      - name: Run smoke checks
        run: node server/scripts/smoke.mjs
      - name: docker compose down
        if: always()
        working-directory: server
        run: docker compose down -v

  ios-build:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    # Required PR gate. Device-target compilation catches Swift, link, and
    # packaging errors without hosted simulator startup. The full XCTest suite
    # runs locally before push, plus nightly/manual in ios-full-test.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build iOS app
        run: make ios-pr-check

  ios-full-test:
    # Simulator startup and the entire XCTest bundle take about fifteen hosted
    # macOS minutes. Run on schedule or explicit dispatch, not every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test full iOS app
        env:
          IOS_TEST_BUILD_SETTINGS: CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-
        run: bash scripts/run-ios-tests.sh

  # The lane's outcome, as issues. Every product job feeds this so a failure
  # anywhere above is filed; the run's own colour is not what the operator
  # watches. Pull requests get their checks inline and file nothing.
  report:
    needs:
      - actionlint
      - go-toolchains
      - file-size
      - admx
      - windows-scripts
      - windows-scripts-ps51
      - vocabulary
      - status-writers
      - server-parity
      - studio-wire
      - check-logging
      - check-swiftlint
      - go-lint
      - sdk-test
      - relay-test
      - desktop-test
      - desktop-test-windows
      - desktop-lint
      - desktop-build
      - shared-test
      - server-typecheck
      - server-lint
      - server-test
      - doc-links
      - server-compose-smoke
      - ios-build
      - ios-full-test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: File failures and flakes as issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never paste this into the command: a commit subject in a job
          # output can hold a quote, and the shell would read it as code.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/report-run-failures.sh ci-failure "Tests failed on main" "The releases this job gates stay drafts until it passes; rerun it or fix forward."
