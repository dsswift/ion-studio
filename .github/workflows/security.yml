name: Security

# Dependency advisories and vulnerability scans read a feed that changes every
# day, so their result is not a property of the commit. They run here, off
# the ship path: nightly and on demand, never on a push to main, never in
# front of a release. A finding is filed as an issue (label: security) for
# the operator to fix in its own change.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  go-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck (relay)
        run: govulncheck ./...
        working-directory: relay
      # The Studio SDK's Go flavor builds against the engine's Go SDK from the
      # pinned engine checkout beside this one.
      - name: Check out the pinned engine
        if: always()
        run: git clone --quiet --depth 1 --branch "engine-v$(tr -d '[:space:]' < engine/VERSION)" https://github.com/dsswift/ion ../ion
      - name: govulncheck (studio sdk)
        if: always()
        run: govulncheck ./...
        working-directory: packages/studio-sdk/go

  desktop-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Lockfile integrity
        run: bash scripts/check-lockfile-integrity.test.sh && node scripts/check-lockfile-integrity.mjs package-lock.json
      - name: npm audit (high+ only, prod deps)
        working-directory: desktop
        run: npm audit --audit-level=high --omit=dev

  report:
    needs: [go-vuln, desktop-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: File findings as issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never paste this into the command: a commit subject in a job
          # output can hold a quote, and the shell would read it as code.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/report-run-failures.sh security "Security scan failed"
