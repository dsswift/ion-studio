# Shared changed-path scopes for the Quality workflow and local regression
# checks. Product jobs consume these on pull requests and on pushes to main;
# scheduled and manual Quality runs deliberately validate every scope.
sdk:
  - 'packages/studio-sdk/**'
relay:
  - 'relay/**'
desktop:
  - 'desktop/**'
  - 'scripts/check-status-writers.sh'
  - 'scripts/check-server-parity.sh'
shared:
  - 'packages/shared/**'
  # The Studio SDK's TypeScript flavor and its contract are tested from here.
  - 'packages/studio-sdk/**'
server:
  - 'server/**'
ios:
  - 'ios/IonRemote/**'
  - 'ios/IonRemoteTests/**'
  - 'ios/IonRemote.xcodeproj/**'
  - 'ios/.swiftlint.yml'
  - 'ios/commands/install.command'
logging:
  - 'relay/**'
  - 'desktop/**'
  - 'packages/shared/**'
  - 'server/**'
  - 'ios/**'
  - 'scripts/check-logging*'
  - 'scripts/test-quality-path-scopes.sh'
workflows:
  - '.github/workflows/**'
  - '.github/scripts/**'
  - '.github/quality-paths.yml'
  - 'scripts/test-quality-path-scopes.sh'
